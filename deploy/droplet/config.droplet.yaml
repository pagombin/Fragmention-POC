# Droplet deployment defaults. Secrets come from /etc/mfpoc/mfpoc.env via
# the systemd EnvironmentFile directive; see install.sh for the env keys.

server:
  listen: "${MFPOC_SERVER_LISTEN:-0.0.0.0:8443}"
  max_request_bytes: 1048576
  read_header_timeout: 10s
  read_timeout: 30s
  write_timeout: 60s
  idle_timeout: 120s
  shutdown_timeout: 30s
  rate_limit_per_minute: 60
  rate_limit_failed_auth_per_minute: 10

  tls:
    enabled: true
    self_signed: true              # ok for droplet without a DNS name
    data_dir: "/var/lib/mfpoc/tls"
    # For a custom cert:
    # cert_file: /etc/mfpoc/tls/cert.pem
    # key_file: /etc/mfpoc/tls/key.pem
    # For ACME (requires DNS pointing at the droplet):
    # acme:
    #   enabled: true
    #   domain: "mfpoc.example.com"
    #   email: "you@example.com"
    #   cache_dir: "/var/lib/mfpoc/acme"

mongo:
  uri: "${env:MFPOC_MONGO_URI}"
  connect_timeout: 30s
  operation_timeout: 30s
  max_pool_size: 100
  app_name: mfpoc

storage:
  path: "/var/lib/mfpoc/mfpoc.db"
  busy_timeout: 5s
  metrics_retention_days: 30
  cluster_metrics_retention_days: 365
  janitor_interval: 24h

logging:
  level: info
  format: json

auth:
  enabled: true
  bearer_token: "${env:MFPOC_AUTH_BEARER_TOKEN}"

loader:
  default_workers: 0
  default_batch_size: 1000
  default_write_concern: "1"
  storage_headroom_percent: 30.0

deleter:
  default_batch_size: 1000
  preview_ttl: 2m
  max_ratio: 0.95
  inter_batch_jitter: 25ms

collector:
  idle_interval: 10s
  active_interval: 2s
  backoff_initial: 1s
  backoff_max: 30s

compact:
  max_replication_lag: 10s
  stepdown_wait_timeout: 60s
  validate_after_compact: false

workload:
  default_target_ops_per_sec: 100
  default_read_weight: 0.7
  default_write_weight: 0.2
  default_aggregate_weight: 0.1

poc:
  database_prefix: "poc_db_"
